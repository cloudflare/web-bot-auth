[package]
name = "signature-agent-card-and-registry"
description = "Signature agent card and registry served over Cloudflare workers"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "0.8", features = ['http'] }
worker-macros = { version = "0.8", features = ['http'] }
web-bot-auth = { workspace = true }

ed25519-dalek = "3.0.0"
getrandom = { version = "0.2", features = ["js"] }

indexmap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
time = { workspace = true }
