sfv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
data-url = { workspace = true }
time = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
time = { workspace = true, features = ["wasm-bindgen"] }
