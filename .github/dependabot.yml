version: 2

multi-ecosystem-groups:
  examples:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/packages/*"
    schedule:
      interval: weekly
    groups:
      packages:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directories:
      - "/"
      - "/crates/*"
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
    groups:
      crates:
        patterns:
          - "*"

  - package-ecosystem: npm
    directories:
      - "/examples/*"
    patterns:
      - "*"
    multi-ecosystem-group: examples

  - package-ecosystem: cargo
    directories:
      - "/examples/*"
    allow:
      - dependency-type: all
    patterns:
      - "*"
    multi-ecosystem-group: examples

  - package-ecosystem: uv
    directories:
      - "/examples/*"
    allow:
      - dependency-type: all
    patterns:
      - "*"
    multi-ecosystem-group: examples

  - package-ecosystem: gomod
    directories:
      - "/examples/*"
    allow:
      - dependency-type: all
    patterns:
      - "*"
    multi-ecosystem-group: examples

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
